# Проверки на каждый push и pull request.
#
# Выкладки здесь нет, и она не нужна: Netlify собирает сам, из своего
# репозитория, по netlify.toml. Ключи живут в переменных Netlify, а сюда
# их класть незачем — см. комментарий у шага сборки.
#
# Смысл проверок в том, чтобы поломка находилась в момент, когда её
# сделали, а не через неделю при сборке для показа заказчику.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      # Главный риск подбора — комбинация ответов, на которой выдача пуста
      # и человек упирается в тупик. Прогоняем все сто сорок четыре.
      - name: Подбор
        run: npm run check:quiz

      # Разметка сообщения в телеграм ломается тихо: бот молчит, а узнаёшь
      # об этом от заказчика, который не дождался заявки.
      - name: Заявка
        run: npm run check:lead

      # Сборка из закоммиченного снимка (app/data), а не с обращением в базу.
      #
      # До этого здесь стоял `npm run build`, который первым делом идёт
      # в Supabase за свежими данными. Ключей в воркфлоу нет и не было,
      # поэтому шаг падал на первой же строке — проверки были красными
      # с тех пор, как данные переехали в базу, и поломки они не ловили.
      #
      # Снимок для того в репозитории и лежит: он полноправное звено,
      # а не кэш, и сборка обязана переживать недоступность Supabase.
      # Проверке свежие данные не нужны — ей нужно знать, что код собирается.
      # Заодно ключи в CI теперь не нужны вовсе, а проверка не краснеет
      # из-за чужой сети.
      #
      # Чего это не покрывает: поломку самого fetch-data.ts. Его типы ловит
      # шаг «Типы», а обращение в базу первым делом делает боевая сборка
      # на хостинге — там это и вскроется, до выкладки.
      - name: Сборка
        run: npm run build:snapshot
