<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Климат Лайн">
  <title>Климат Лайн</title>

  <!--
    Значок вкладки: буква К из логотипа на фирменной плитке.

    Нарисован заново, а не уменьшен из присланного растра. В логотипе четыре
    элемента — кольцо, буква, снежинка и волны, — и на шестнадцати точках
    все они превращаются в синее пятно: кольцо становится тоньше пикселя,
    снежинка — четырьмя серыми точками. Остаётся то, что читается в любом
    размере: силуэт буквы и цвет.

    Плитка, а не прозрачный фон: у вкладки нет своего цвета — в тёмной теме
    браузера тёмно-синяя буква логотипа пропала бы совсем. Залитый квадрат
    выглядит одинаково в обеих темах.

    Градиент и волна взяты из самого знака: голубой слева, насыщенный синий
    справа, волна пересекает букву внизу — там же, где в оригинале.
  -->

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e9bff"/>
      <stop offset="1" stop-color="#0b40d8"/>
    </linearGradient>

    <!-- Волна обрезается по плитке: иначе её концы торчат за скруглением. -->
    <clipPath id="tileShape">
      <rect width="64" height="64" rx="13"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#tile)"/>

  <g clip-path="url(#tileShape)">
    <!--
      Волна под буквой. Полупрозрачная, а не белая: сплошная разрезала бы
      букву надвое, и на маленьком размере вместо «К» читались бы два
      несвязанных куска.
    -->
    <path d="M-4 45c10-7 18-7 28 0s22 7 44-2v25H-4z" fill="#fff" opacity=".18"/>
    <path d="M-4 45c10-7 18-7 28 0s22 7 44-2" fill="none" stroke="#fff" stroke-width="3" opacity=".45"/>
  </g>

  <!--
    Буква. Пропорции сняты с логотипа: широкий прямой ствол, верхний луч
    клином вверх-вправо, нижний — вниз-вправо, встречаются на трети ширины.
  -->
  <path d="M15 14h9.5v14.5L37 14h11L31.5 32.5 48.5 50H37L24.5 36.5V50H15z" fill="#fff"/>
</svg>
