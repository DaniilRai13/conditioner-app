# =============================================================================
# Netlify — как собирать сайт.
#
# Только сборка. Поведение готового сайта — переадресации и заголовки —
# описано в `public/_redirects` и `public/_headers`: оттуда они попадают
# внутрь собранной статики и работают при любом способе выкладки, включая
# ручную. Здесь их держать нельзя ещё и потому, что этот файл, оказавшись
# рядом со статикой, заставляет Netlify искать package.json в папке,
# где его нет, и выкладка падает.
#
# Больше о площадке не знает ничего, кроме `netlify/functions/*.ts` — трёх
# обёрток по три строки над обработчиками из `app/lib`. Сами обработчики
# написаны на веб-стандартах: переезд — это новые обёртки, а не правка логики.
# =============================================================================

[build]
  # build:preview, а не build — и это важно, пока нет своего домена.
  #
  # Обычная сборка ставит в canonical и og-ссылки `https://example.by`
  # (заглушка из config/site.ts) и разрешает индексацию. Выложить такое
  # на адрес вида xxx.netlify.app значит пустить в поиск сайт, который
  # ссылается сам на несуществующий домен. Когда домен появится —
  # поменять команду на `npm run build` и убрать VITE_PREVIEW_URL
  # из переменных окружения. Это пункт 5 списка «до запуска» в PLAN.md.
  command = "npm run build:preview"

  # ssr: false — на выходе только статика. Серверного бандла нет.
  publish = "build/client"

[build.environment]
  # Пин, а не «что даст площадка по умолчанию». Скрипты сборки написаны
  # на TypeScript и запускаются Node напрямую (`node scripts/fetch-data.ts`),
  # без сборщика — это работает начиная с Node 22.18, где снятие типов
  # включено по умолчанию. На версии старше сборка упадёт на первой строке
  # первого скрипта, и сообщение будет про синтаксис, а не про версию.
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

  # Адреса (/api/lead и остальные) заданы в самих функциях через
  # `export const config`, поэтому переадресаций для них нет нигде.
